name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests with local fixtures
        run: python -m unittest discover -s plugins/gerrit-review -p 'test_*.py'
      - name: Check panel JavaScript and source line mapping
        run: |
          node --check plugins/gerrit-review/web/panel.js
          node plugins/gerrit-review/web/test_panel.cjs
      - name: Validate manifests and build release packages
        run: python scripts/package_release.py
      - name: Verify package checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS
